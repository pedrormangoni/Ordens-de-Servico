<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="theme-color" content="#2563EB"/>
        <title><ui:insert name="title">Executa</ui:insert></title>
        
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
        
        <!-- Icons: PrimeIcons (bundled via PrimeFaces) -->
        
        <!-- PrimeFlex -->
        <h:outputStylesheet library="manhattan-layout/css" name="primeflex.min.css"/>
        <h:outputStylesheet name="primeicons/primeicons.css" library="primefaces"/>
        
        <!-- Design System -->
        <h:outputStylesheet library="manhattan-layout/css" name="executa-design-system.css"/>
        <h:outputStylesheet library="manhattan-layout/css" name="executa.css"/>
        
        <!-- Custom Styles -->
        <ui:insert name="head"/>
    </h:head>

    <h:body>
        <div class="layout-container">
            
            <!-- SIDEBAR -->
            <aside class="layout-sidebar" role="complementary">
                <!-- Logo -->
                <div class="sidebar-logo">
                    <i class="pi pi-bolt"></i>
                    <span>Executa</span>
                </div>
                
                <!-- Navigation -->
                <nav class="sidebar-nav" role="navigation" aria-label="Menu principal">
                    <a href="#{request.contextPath}/dashboard" class="nav-item">
                        <i class="pi pi-home"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#{request.contextPath}/service-orders" class="nav-item">
                        <i class="pi pi-list"></i>
                        <span>Ordens de Serviço</span>
                    </a>
                    <a href="#{request.contextPath}/services" class="nav-item">
                        <i class="pi pi-briefcase"></i>
                        <span>Serviços</span>
                    </a>
                    <a href="#{request.contextPath}/clients" class="nav-item">
                        <i class="pi pi-users"></i>
                        <span>Clientes</span>
                    </a>
                    <a href="#{request.contextPath}/users" class="nav-item">
                        <i class="pi pi-user"></i>
                        <span>Usuários</span>
                    </a>
                    <a href="#{request.contextPath}/cash-flow" class="nav-item">
                        <i class="pi pi-wallet"></i>
                        <span>Fluxo de Caixa</span>
                    </a>
                </nav>
                
                <!-- User Profile -->
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar">
                        <h:outputText value="#{userController.loggedUser != null ? userController.loggedUser.name.substring(0,1).toUpperCase() : 'U'}"/>
                    </div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">
                            <h:outputText value="#{userController.loggedUser != null ? userController.loggedUser.name : 'Usuário'}"/>
                        </div>
                        <div class="sidebar-user-role">
                            <h:outputText value="#{userController.loggedUser != null ? userController.loggedUser.email : 'Não autenticado'}"/>
                        </div>
                    </div>
                    <a href="#{request.contextPath}/login.xhtml" title="Sair">
                        <i class="pi pi-sign-out"></i>
                    </a>
                </div>
            </aside>
            
            <!-- MAIN CONTENT -->
            <div class="layout-content">
                
                <!-- HEADER -->
                <header class="layout-header" role="banner">
                    <h1 class="header-title">
                        <ui:insert name="page-title">Bem-vindo</ui:insert>
                    </h1>
                    
                    <div class="header-icons">
                        <!-- Notificações -->
                        <button class="header-icon-btn" title="Notificações" aria-label="Notificações">
                            <i class="pi pi-bell"></i>
                            <span class="header-icon-badge"></span>
                        </button>
                        
                        <!-- Mensagens -->
                        <button class="header-icon-btn" title="Mensagens" aria-label="Mensagens">
                            <i class="pi pi-envelope"></i>
                        </button>
                        
                        <!-- Configurações -->
                        <button class="header-icon-btn" title="Configurações" aria-label="Configurações">
                            <i class="pi pi-cog"></i>
                        </button>
                    </div>
                </header>
                
                <!-- BODY -->
                <main class="layout-body" role="main">
                    <ui:insert name="content"/>
                </main>
                
                <!-- FOOTER -->
                <footer class="layout-footer" role="contentinfo">
                    <p>© 2026 Executa. Todos os direitos reservados.</p>
                </footer>
            </div>
        </div>
    </h:body>
</html>
