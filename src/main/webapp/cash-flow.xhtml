<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/WEB-INF/template.xhtml">

        <ui:define name="title">
            <h:outputText value="Fluxo de Caixa"/>
        </ui:define>

        <ui:define name="content">
            <f:metadata>
                <f:viewAction action="#{cashFlowController.refresh}" onPostback="false"/>
            </f:metadata>
            <div class="grid">
                <div class="col-12">
                    <div class="executa-page-header mb-4">
                        <h3 class="m-0 mb-2">Fluxo de Caixa</h3>
                        <p class="executa-page-caption m-0">Controle entradas, saídas e saldo financeiro.</p>
                    </div>
                </div>

                <div class="col-12">
                    <h:form id="frmList">
                        <p:growl id="growl" showDetail="true" life="4000"/>

                        <h:panelGroup id="summarySection">
                            <div class="grid">
                                <div class="col-12 md:col-4">
                                    <div class="card h-full">
                                        <p class="executa-page-caption m-0 mb-2">
                                            <i class="pi pi-arrow-down-left mr-2"/>Entradas
                                        </p>
                                        <h3 class="m-0 executa-stat-value">
                                            <h:outputText value="#{cashFlowController.filteredIncome}">
                                                <f:convertNumber type="currency" currencySymbol="R$ " minFractionDigits="2" locale="pt_BR"/>
                                            </h:outputText>
                                        </h3>
                                    </div>
                                </div>

                                <div class="col-12 md:col-4">
                                    <div class="card h-full">
                                        <p class="executa-page-caption m-0 mb-2">
                                            <i class="pi pi-arrow-up-right mr-2"/>Saídas
                                        </p>
                                        <h3 class="m-0 executa-stat-value text-red-500">
                                            <h:outputText value="#{cashFlowController.filteredExpense}">
                                                <f:convertNumber type="currency" currencySymbol="R$ " minFractionDigits="2" locale="pt_BR"/>
                                            </h:outputText>
                                        </h3>
                                    </div>
                                </div>

                                <div class="col-12 md:col-4">
                                    <div class="card h-full">
                                        <p class="executa-page-caption m-0 mb-2">
                                            <i class="pi pi-wallet mr-2"/>Saldo
                                        </p>
                                        <h3 class="m-0 executa-stat-value">
                                            <h:outputText value="#{cashFlowController.filteredNetBalance}">
                                                <f:convertNumber type="currency" currencySymbol="R$ " minFractionDigits="2" locale="pt_BR"/>
                                            </h:outputText>
                                        </h3>
                                    </div>
                                </div>
                            </div>
                        </h:panelGroup>

                        <div class="executa-page-toolbar flex flex-column lg:flex-row justify-content-between align-items-stretch lg:align-items-end flex-wrap lg:flex-nowrap row-gap-3 column-gap-3 mb-3 mt-3">
                            <div class="flex flex-column md:flex-row flex-wrap align-items-end row-gap-3 column-gap-3 flex-grow-1">
                                <div class="field m-0 executa-field-date">
                                    <p:outputLabel for="periodStart" value="De" styleClass="block mb-2"/>
                                    <p:datePicker id="periodStart"
                                                  value="#{cashFlowController.periodStartDate}"
                                                  pattern="dd/MM/yyyy"
                                                  locale="pt"
                                                  showIcon="true"
                                                  styleClass="executa-date-input">
                                        <p:ajax event="dateSelect" process="@this" update="@none"/>
                                    </p:datePicker>
                                </div>
                                <div class="field m-0 executa-field-date">
                                    <p:outputLabel for="periodEnd" value="Até" styleClass="block mb-2"/>
                                    <p:datePicker id="periodEnd"
                                                  value="#{cashFlowController.periodEndDate}"
                                                  pattern="dd/MM/yyyy"
                                                  locale="pt"
                                                  showIcon="true"
                                                  styleClass="executa-date-input">
                                        <p:ajax event="dateSelect" process="@this" update="@none"/>
                                    </p:datePicker>
                                </div>
                                <div class="field m-0 executa-filter-actions">
                                    <p:commandButton value="Filtrar"
                                                     icon="pi pi-filter"
                                                     action="#{cashFlowController.applyPeriodFilter}"
                                                     update=":frmList:growl :frmList:summarySection :frmList:cashFlowTable"
                                                     process=":frmList:periodStart :frmList:periodEnd @this"/>
                                    <p:commandButton value="Limpar"
                                                     icon="pi pi-filter-slash"
                                                     styleClass="ui-button-secondary"
                                                     action="#{cashFlowController.clearPeriodFilter}"
                                                     update=":frmList:growl :frmList:summarySection :frmList:cashFlowTable :frmList:periodStart :frmList:periodEnd :frmList:searchTerm"
                                                     process="@this"/>
                                </div>
                            </div>

                            <div class="flex flex-column md:flex-row row-gap-3 column-gap-3 align-items-stretch md:align-items-end flex-shrink-0">
                                <span class="p-input-icon-left w-full md:w-20rem">
                                    <i class="pi pi-search"/>
                                    <p:inputText id="searchTerm"
                                                 value="#{cashFlowController.searchTerm}"
                                                 placeholder="Pesquisar lançamento...">
                                    <p:ajax event="keyup"
                                            process="@this"
                                            update=":frmList:summarySection :frmList:cashFlowTable"
                                            delay="300"/>
                                    </p:inputText>
                                </span>
                                <p:commandButton id="btnCreate"
                                                 value="Novo Lançamento"
                                                 icon="pi pi-plus"
                                                 styleClass="w-full md:w-auto"
                                                 actionListener="#{cashFlowController.prepareCreate()}"
                                                 update=":CreateForm"
                                                 process="@this"
                                                 onclick="PF('dlgCreate').show()"/>
                            </div>
                        </div>

                        <p:panel styleClass="executa-data-panel">
                            <p:dataTable id="cashFlowTable"
                                         widgetVar="cashFlowTable"
                                         styleClass="executa-clients-table"
                                         value="#{cashFlowController.filteredList}"
                                         var="item"
                                         rowKey="#{item.id}"
                                         paginator="true"
                                         rows="10"
                                         rowsPerPageTemplate="10,25,50"
                                         paginatorPosition="bottom"
                                         responsiveLayout="scroll"
                                         emptyMessage="Nenhum lançamento encontrado.">

                                <p:column headerText="Data" sortBy="#{item.transactionDate}">
                                    <h:outputText value="#{item.transactionDate}">
                                        <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Tipo" sortBy="#{item.type}">
                                    <p:tag value="#{cashFlowController.formatType(item.type)}"
                                           severity="success"
                                           rendered="#{item.type eq 'INCOME'}"/>
                                    <p:tag value="#{cashFlowController.formatType(item.type)}"
                                           severity="danger"
                                           rendered="#{item.type eq 'EXPENSE'}"/>
                                </p:column>

                                <p:column headerText="Descrição" sortBy="#{item.description}">
                                    <h:outputText value="#{item.description}"/>
                                </p:column>

                                <p:column headerText="Ordem de Serviço">
                                    <h:outputText value="#{cashFlowController.formatServiceOrder(item)}"
                                                  styleClass="#{item.serviceOrder == null ? 'executa-text-muted' : ''}"/>
                                </p:column>

                                <p:column headerText="Cadastrado por" sortBy="#{item.createdBy.name}">
                                    <h:outputText value="#{cashFlowController.formatCreatedBy(item)}"/>
                                </p:column>

                                <p:column headerText="Valor" sortBy="#{item.amount}">
                                    <h:outputText value="#{item.amount}"
                                                  styleClass="#{item.type eq 'EXPENSE' ? 'text-red-500' : ''}">
                                        <f:convertNumber type="currency" currencySymbol="R$ " minFractionDigits="2" locale="pt_BR"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Pagamento" sortBy="#{item.paymentMethod}">
                                    <h:outputText value="#{item.paymentMethod}" rendered="#{not empty item.paymentMethod}"/>
                                    <h:outputText value="—" styleClass="executa-text-muted" rendered="#{empty item.paymentMethod}"/>
                                </p:column>

                                <p:column headerText="Ações" exportable="false">
                                    <div class="executa-row-actions">
                                        <p:commandButton icon="pi pi-trash"
                                                     title="Excluir"
                                                     styleClass="ui-button-sm ui-button-outlined ui-button-danger"
                                                     actionListener="#{cashFlowController.delete(item)}"
                                                     update=":frmList:growl :frmList:summarySection :frmList:cashFlowTable"
                                                     process="@this"
                                                     rendered="#{item.serviceOrder == null}">
                                        <p:confirm header="Excluir lançamento"
                                                   message="Deseja excluir este lançamento?"
                                                   icon="pi pi-exclamation-triangle"/>
                                    </p:commandButton>
                                    </div>
                                    <h:outputText value="—"
                                                  styleClass="executa-text-muted"
                                                  rendered="#{item.serviceOrder != null}"/>
                                </p:column>
                            </p:dataTable>
                        </p:panel>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
                        </p:confirmDialog>
                    </h:form>
                </div>
            </div>

            <p:dialog header="Novo Lançamento"
                      widgetVar="dlgCreate"
                      styleClass="executa-dialog"
                      modal="true"
                      responsive="true"
                      fitViewport="true"
                      resizable="false"
                      showEffect="fade"
                      hideEffect="fade">
                <h:form id="CreateForm">
                    <p:messages id="createMessages" showDetail="true" closable="true"/>
                    <div class="formgrid grid">
                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptType" value="Tipo"/>
                            <p:selectOneMenu id="iptType"
                                             value="#{cashFlowController.cashFlow.type}"
                                             styleClass="w-full"
                                             required="true"
                                             requiredMessage="Selecione o tipo">
                                <f:selectItem itemLabel="Entrada" itemValue="INCOME"/>
                                <f:selectItem itemLabel="Saída" itemValue="EXPENSE"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptAmount" value="Valor"/>
                            <p:inputNumber id="iptAmount"
                                           value="#{cashFlowController.cashFlow.amount}"
                                           styleClass="w-full"
                                           mode="decimal"
                                           minFractionDigits="2"
                                           maxFractionDigits="2"
                                           decimalSeparator=","
                                           thousandSeparator="."
                                           prefix="R$ "
                                           locale="pt_BR"
                                           minValue="0.01"
                                           maxValue="99999999.99"
                                           required="true"
                                           requiredMessage="Informe o valor"/>
                        </div>

                        <div class="field col-12">
                            <p:outputLabel for="iptDescription" value="Descrição"/>
                            <p:inputText id="iptDescription"
                                         value="#{cashFlowController.cashFlow.description}"
                                         styleClass="w-full"
                                         maxlength="255"
                                         required="true"
                                         requiredMessage="Informe a descrição"/>
                        </div>

                        <div class="field col-12">
                            <p:outputLabel for="iptPaymentMethod" value="Forma de pagamento"/>
                            <p:selectOneMenu id="iptPaymentMethod"
                                             value="#{cashFlowController.cashFlow.paymentMethod}"
                                             styleClass="w-full">
                                <f:selectItem itemLabel="Selecione..." itemValue="#{null}"/>
                                <f:selectItem itemLabel="Dinheiro" itemValue="Dinheiro"/>
                                <f:selectItem itemLabel="PIX" itemValue="PIX"/>
                                <f:selectItem itemLabel="Cartão de crédito" itemValue="Cartão de crédito"/>
                                <f:selectItem itemLabel="Cartão de débito" itemValue="Cartão de débito"/>
                                <f:selectItem itemLabel="Transferência" itemValue="Transferência"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <div class="flex justify-content-end gap-2 mt-4">
                        <p:commandButton value="Cancelar"
                                         type="button"
                                         styleClass="ui-button-secondary"
                                         icon="pi pi-times"
                                         onclick="PF('dlgCreate').hide()"/>
                        <p:commandButton value="Salvar"
                                         icon="pi pi-check"
                                         process="@form"
                                         actionListener="#{cashFlowController.create()}"
                                         update=":frmList:growl :frmList:summarySection :frmList:cashFlowTable @form"
                                         oncomplete="if (args &amp;&amp; args.saved) PF('dlgCreate').hide()"/>
                    </div>
                </h:form>
            </p:dialog>
        </ui:define>
    </ui:composition>
</html>
