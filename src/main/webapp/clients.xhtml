<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/WEB-INF/template.xhtml">

        <ui:define name="title">
            <h:outputText value="Clientes"/>
        </ui:define>

        <ui:define name="content">
            <div class="grid">
                <div class="col-12">
                    <div class="executa-page-header mb-4">
                        <h3 class="m-0 mb-2">Clientes</h3>
                        <p class="executa-page-caption m-0">Gerencie os clientes cadastrados no sistema.</p>
                    </div>
                </div>

                <div class="col-12">
                    <h:form id="frmList">
                        <p:growl id="growl" showDetail="true" life="4000"/>

                        <div class="executa-page-toolbar flex flex-column md:flex-row justify-content-between align-items-stretch md:align-items-center gap-3 mb-3">
                            <span class="p-input-icon-left w-full md:w-20rem">
                                <i class="pi pi-search"/>
                                <p:inputText id="searchTerm"
                                             value="#{clientController.searchTerm}"
                                             placeholder="Pesquisar cliente...">
                                    <p:ajax event="keyup"
                                            process="@this"
                                            update="clientsTable"
                                            delay="300"/>
                                </p:inputText>
                            </span>
                            <p:commandButton id="btnCreate"
                                             value="Novo Cliente"
                                             icon="pi pi-plus"
                                             styleClass="w-full md:w-auto"
                                             actionListener="#{clientController.prepareCreate()}"
                                             update="CreateForm"
                                             process="@this"
                                             onclick="PF('dlgCreate').show()"/>
                        </div>

                        <p:panel styleClass="executa-data-panel">
                            <p:dataTable id="clientsTable"
                                         widgetVar="clientsTable"
                                         styleClass="executa-clients-table"
                                         value="#{clientController.filteredList}"
                                         var="item"
                                         rowKey="#{item.id}"
                                         paginator="true"
                                         rows="10"
                                         rowsPerPageTemplate="10,25,50"
                                         paginatorPosition="bottom"
                                         responsiveLayout="scroll"
                                         emptyMessage="Nenhum cliente encontrado.">

                                <p:column headerText="Nome" sortBy="#{item.name}">
                                    <h:outputText value="#{item.name}"/>
                                </p:column>

                                <p:column headerText="CPF" sortBy="#{item.document}">
                                    <h:outputText value="#{clientController.formatCpfDisplay(item.document)}"/>
                                </p:column>

                                <p:column headerText="Telefone" sortBy="#{item.phone}">
                                    <h:outputText value="#{item.phone}" rendered="#{not empty item.phone}"/>
                                    <h:outputText value="—" styleClass="executa-text-muted" rendered="#{empty item.phone}"/>
                                </p:column>

                                <p:column headerText="E-mail" sortBy="#{item.email}">
                                    <h:outputText value="#{item.email}" rendered="#{not empty item.email}"/>
                                    <h:outputText value="—" styleClass="executa-text-muted" rendered="#{empty item.email}"/>
                                </p:column>

                                <p:column headerText="Cadastrado por" sortBy="#{item.createdBy.name}">
                                    <h:outputText value="#{clientController.formatCreatedBy(item)}"/>
                                </p:column>

                                <p:column headerText="Status" sortBy="#{item.createdAt}">
                                    <p:tag value="Ativo" severity="success"/>
                                </p:column>

                                <p:column headerText="Ações" exportable="false">
                                    <div class="executa-row-actions">
                                        <p:commandButton icon="pi pi-pencil"
                                                         title="Editar"
                                                         styleClass="ui-button-sm ui-button-outlined"
                                                         actionListener="#{clientController.prepareEdit(item)}"
                                                         update="formEdit"
                                                         process="@this"
                                                         oncomplete="PF('dlgEdit').show()"/>
                                        <p:commandButton icon="pi pi-trash"
                                                         title="Excluir"
                                                         styleClass="ui-button-sm ui-button-outlined ui-button-danger"
                                                         actionListener="#{clientController.delete(item)}"
                                                         update="frmList"
                                                         process="@this"
                                                         rendered="#{clientController.canDelete(item)}">
                                            <p:confirm header="Excluir cliente"
                                                       message="Deseja excluir #{item.name}?"
                                                       icon="pi pi-exclamation-triangle"/>
                                        </p:commandButton>
                                        <h:outputText value="—"
                                                      styleClass="executa-text-muted"
                                                      title="Cliente com ordens de serviço vinculadas"
                                                      rendered="#{not clientController.canDelete(item)}"/>
                                    </div>
                                </p:column>
                            </p:dataTable>
                        </p:panel>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
                        </p:confirmDialog>
                    </h:form>
                </div>
            </div>

            <p:dialog header="Novo Cliente"
                      widgetVar="dlgCreate"
                      styleClass="executa-dialog"
                      modal="true"
                      responsive="true"
                      fitViewport="true"
                      resizable="false"
                      showEffect="fade"
                      hideEffect="fade">
                <h:form id="CreateForm">
                    <p:messages id="createMessages" showDetail="true" closable="true"/>
                    <div class="formgrid grid">
                        <div class="field col-12">
                            <p:outputLabel for="iptName" value="Nome"/>
                            <p:inputText id="iptName"
                                         value="#{clientController.client.name}"
                                         styleClass="w-full"
                                         required="true"
                                         requiredMessage="Informe o nome do cliente"
                                         maxlength="150"/>
                        </div>

                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptDocument" value="CPF"/>
                            <p:inputMask id="iptDocument"
                                         value="#{clientController.client.document}"
                                         mask="999.999.999-99"
                                         unmask="true"
                                         validateClient="false"
                                         styleClass="w-full"
                                         required="true"
                                         requiredMessage="Informe o CPF do cliente"/>
                        </div>

                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptPhone" value="Telefone"/>
                            <p:inputMask id="iptPhone"
                                         value="#{clientController.client.phone}"
                                         mask="(99) 99999-9999"
                                         styleClass="w-full"/>
                        </div>

                        <div class="field col-12">
                            <p:outputLabel for="iptEmail" value="E-mail"/>
                            <p:inputText id="iptEmail"
                                         value="#{clientController.client.email}"
                                         styleClass="w-full"
                                         maxlength="150"/>
                        </div>

                        <div class="field col-12">
                            <p:outputLabel for="iptAddress" value="Endereço"/>
                            <p:inputTextarea id="iptAddress"
                                             value="#{clientController.client.address}"
                                             rows="3"
                                             styleClass="w-full"
                                             maxlength="500"
                                             autoResize="false"/>
                        </div>
                    </div>

                    <div class="flex justify-content-end gap-2 mt-4">
                        <p:commandButton value="Cancelar"
                                         type="button"
                                         styleClass="ui-button-secondary"
                                         icon="pi pi-times"
                                         onclick="PF('dlgCreate').hide()"/>
                        <p:commandButton value="Salvar"
                                         icon="pi pi-check"
                                         process="@form"
                                         actionListener="#{clientController.create()}"
                                         update=":frmList:growl :frmList:clientsTable @form"
                                         oncomplete="if (args.saved) PF('dlgCreate').hide()"/>
                    </div>
                </h:form>
            </p:dialog>

            <p:dialog header="Editar Cliente"
                      widgetVar="dlgEdit"
                      styleClass="executa-dialog"
                      modal="true"
                      responsive="true"
                      fitViewport="true"
                      resizable="false"
                      showEffect="fade"
                      hideEffect="fade">
                <h:form id="formEdit">
                    <p:messages id="editMessages" showDetail="true" closable="true"/>
                    <ui:fragment rendered="#{clientController.selected != null}">
                    <div class="formgrid grid">
                        <div class="field col-12">
                            <p:outputLabel for="iptNomeEdit" value="Nome"/>
                            <p:inputText id="iptNomeEdit"
                                         value="#{clientController.selected.name}"
                                         styleClass="w-full"
                                         required="true"
                                         requiredMessage="Informe o nome do cliente"
                                         maxlength="150"/>
                        </div>

                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptDocumentEdit" value="CPF"/>
                            <p:inputMask id="iptDocumentEdit"
                                         value="#{clientController.selected.document}"
                                         mask="999.999.999-99"
                                         unmask="true"
                                         validateClient="false"
                                         styleClass="w-full"
                                         required="true"
                                         requiredMessage="Informe o CPF do cliente"/>
                        </div>

                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptPhoneEdit" value="Telefone"/>
                            <p:inputMask id="iptPhoneEdit"
                                         value="#{clientController.selected.phone}"
                                         mask="(99) 99999-9999"
                                         styleClass="w-full"/>
                        </div>

                        <div class="field col-12">
                            <p:outputLabel for="iptEmailEdit" value="E-mail"/>
                            <p:inputText id="iptEmailEdit"
                                         value="#{clientController.selected.email}"
                                         styleClass="w-full"
                                         maxlength="150"/>
                        </div>

                        <div class="field col-12">
                            <p:outputLabel for="iptAddressEdit" value="Endereço"/>
                            <p:inputTextarea id="iptAddressEdit"
                                             value="#{clientController.selected.address}"
                                             rows="3"
                                             styleClass="w-full"
                                             maxlength="500"
                                             autoResize="false"/>
                        </div>
                    </div>
                    </ui:fragment>

                    <div class="flex justify-content-end gap-2 mt-4">
                        <p:commandButton value="Cancelar"
                                         type="button"
                                         styleClass="ui-button-secondary"
                                         icon="pi pi-times"
                                         onclick="PF('dlgEdit').hide()"/>
                        <p:commandButton value="Salvar"
                                         icon="pi pi-check"
                                         process="@form"
                                         actionListener="#{clientController.edit()}"
                                         update=":frmList:growl :frmList:clientsTable @form"
                                         oncomplete="if (args.saved) PF('dlgEdit').hide()"/>
                    </div>
                </h:form>
            </p:dialog>
        </ui:define>
    </ui:composition>
</html>
