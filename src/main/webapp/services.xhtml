<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/WEB-INF/template.xhtml">

        <ui:define name="title">
            <h:outputText value="Serviços"/>
        </ui:define>

        <ui:define name="content">
            <div class="grid">
                <div class="col-12">
                    <div class="executa-page-header mb-4">
                        <h3 class="m-0 mb-2">Serviços</h3>
                        <p class="executa-page-caption m-0">Cadastre os serviços disponíveis para as ordens de serviço.</p>
                    </div>
                </div>

                <div class="col-12">
                    <h:form id="frmList">
                        <p:growl id="growl" showDetail="true" life="4000"/>

                        <div class="executa-page-toolbar flex flex-column md:flex-row justify-content-between align-items-stretch md:align-items-center gap-3 mb-3">
                            <span class="p-input-icon-left w-full md:w-20rem">
                                <i class="pi pi-search"/>
                                <p:inputText id="searchTerm"
                                             value="#{serviceController.searchTerm}"
                                             placeholder="Pesquisar serviço...">
                                    <p:ajax event="keyup"
                                            process="@this"
                                            update="servicesTable"
                                            delay="300"/>
                                </p:inputText>
                            </span>
                            <p:commandButton id="btnCreate"
                                             value="Novo Serviço"
                                             icon="pi pi-plus"
                                             styleClass="w-full md:w-auto"
                                             actionListener="#{serviceController.prepareCreate()}"
                                             update="CreateForm"
                                             process="@this"
                                             onclick="PF('dlgCreate').show()"/>
                        </div>

                        <p:panel styleClass="executa-data-panel">
                            <p:dataTable id="servicesTable"
                                         widgetVar="servicesTable"
                                         styleClass="executa-clients-table"
                                         value="#{serviceController.filteredList}"
                                         var="item"
                                         rowKey="#{item.id}"
                                         paginator="true"
                                         rows="10"
                                         rowsPerPageTemplate="10,25,50"
                                         paginatorPosition="bottom"
                                         responsiveLayout="scroll"
                                         emptyMessage="Nenhum serviço cadastrado.">

                                <p:column headerText="Nome" sortBy="#{item.name}">
                                    <h:outputText value="#{item.name}"/>
                                </p:column>

                                <p:column headerText="Descrição" sortBy="#{item.description}">
                                    <h:outputText value="#{item.description}" rendered="#{not empty item.description}"/>
                                    <h:outputText value="—" styleClass="executa-text-muted" rendered="#{empty item.description}"/>
                                </p:column>

                                <p:column headerText="Preço" sortBy="#{item.price}">
                                    <h:outputText value="#{item.price}">
                                        <f:convertNumber type="currency" currencySymbol="R$ " minFractionDigits="2" locale="pt_BR"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Cadastrado por" sortBy="#{item.createdBy.name}">
                                    <h:outputText value="#{serviceController.formatCreatedBy(item)}"/>
                                </p:column>

                                <p:column headerText="Status" sortBy="#{item.active}">
                                    <p:tag value="Ativo" severity="success" rendered="#{item.active}"/>
                                    <p:tag value="Inativo" severity="danger" rendered="#{not item.active}"/>
                                </p:column>

                                <p:column headerText="Ações" exportable="false">
                                    <div class="executa-row-actions">
                                        <p:commandButton icon="pi pi-pencil"
                                                         title="Editar"
                                                         styleClass="ui-button-sm ui-button-outlined"
                                                         actionListener="#{serviceController.prepareEdit(item)}"
                                                         update="formEdit"
                                                         process="@this"
                                                         oncomplete="PF('dlgEdit').show()"/>
                                        <p:commandButton icon="pi pi-trash"
                                                         title="Excluir"
                                                         styleClass="ui-button-sm ui-button-outlined ui-button-danger"
                                                         actionListener="#{serviceController.delete(item)}"
                                                         update="frmList"
                                                         process="@this">
                                            <p:confirm header="Excluir serviço"
                                                       message="Deseja excluir #{item.name}?"
                                                       icon="pi pi-exclamation-triangle"/>
                                        </p:commandButton>
                                    </div>
                                </p:column>
                            </p:dataTable>
                        </p:panel>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
                        </p:confirmDialog>
                    </h:form>
                </div>
            </div>

            <p:dialog header="Novo Serviço"
                      widgetVar="dlgCreate"
                      styleClass="executa-dialog"
                      modal="true"
                      responsive="true"
                      fitViewport="true"
                      resizable="false"
                      showEffect="fade"
                      hideEffect="fade">
                <h:form id="CreateForm">
                    <p:messages id="createMessages" showDetail="true" closable="true"/>
                    <div class="formgrid grid">
                        <div class="field col-12">
                            <p:outputLabel for="iptName" value="Nome"/>
                            <p:inputText id="iptName"
                                         value="#{serviceController.service.name}"
                                         styleClass="w-full"
                                         required="true"
                                         requiredMessage="Informe o nome do serviço"
                                         maxlength="150"/>
                        </div>

                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptPrice" value="Preço"/>
                            <p:inputNumber id="iptPrice"
                                           value="#{serviceController.service.price}"
                                           styleClass="w-full"
                                           mode="decimal"
                                           minFractionDigits="2"
                                           maxFractionDigits="2"
                                           decimalSeparator=","
                                           thousandSeparator="."
                                           prefix="R$ "
                                           locale="pt_BR"
                                           minValue="0"
                                           maxValue="99999999.99"
                                           required="true"
                                           requiredMessage="Informe o preço do serviço"/>
                        </div>

                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="iptActive" value="Status"/>
                            <p:selectOneMenu id="iptActive"
                                             value="#{serviceController.service.active}"
                                             styleClass="w-full">
                                <f:selectItem itemLabel="Ativo" itemValue="#{true}"/>
                                <f:selectItem itemLabel="Inativo" itemValue="#{false}"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="field col-12">
                            <p:outputLabel for="iptDescription" value="Descrição"/>
                            <p:inputTextarea id="iptDescription"
                                             value="#{serviceController.service.description}"
                                             rows="3"
                                             styleClass="w-full"
                                             maxlength="1000"
                                             autoResize="false"/>
                        </div>
                    </div>

                    <div class="flex justify-content-end gap-2 mt-4">
                        <p:commandButton value="Cancelar"
                                         type="button"
                                         styleClass="ui-button-secondary"
                                         icon="pi pi-times"
                                         onclick="PF('dlgCreate').hide()"/>
                        <p:commandButton value="Salvar"
                                         icon="pi pi-check"
                                         process="@form"
                                         actionListener="#{serviceController.create()}"
                                         update=":frmList:growl :frmList:servicesTable @form"
                                         oncomplete="if (args.saved) PF('dlgCreate').hide()"/>
                    </div>
                </h:form>
            </p:dialog>

            <p:dialog header="Editar Serviço"
                      widgetVar="dlgEdit"
                      styleClass="executa-dialog"
                      modal="true"
                      responsive="true"
                      fitViewport="true"
                      resizable="false"
                      showEffect="fade"
                      hideEffect="fade">
                <h:form id="formEdit">
                    <p:messages id="editMessages" showDetail="true" closable="true"/>
                    <ui:fragment rendered="#{serviceController.selected != null}">
                        <div class="formgrid grid">
                            <div class="field col-12">
                                <p:outputLabel for="iptNameEdit" value="Nome"/>
                                <p:inputText id="iptNameEdit"
                                             value="#{serviceController.selected.name}"
                                             styleClass="w-full"
                                             required="true"
                                             requiredMessage="Informe o nome do serviço"
                                             maxlength="150"/>
                            </div>

                            <div class="field col-12 md:col-6">
                                <p:outputLabel for="iptPriceEdit" value="Preço"/>
                                <p:inputNumber id="iptPriceEdit"
                                               value="#{serviceController.selected.price}"
                                               styleClass="w-full"
                                               mode="decimal"
                                               minFractionDigits="2"
                                               maxFractionDigits="2"
                                               decimalSeparator=","
                                               thousandSeparator="."
                                               prefix="R$ "
                                               locale="pt_BR"
                                               minValue="0"
                                               maxValue="99999999.99"
                                               required="true"
                                               requiredMessage="Informe o preço do serviço"/>
                            </div>

                            <div class="field col-12 md:col-6">
                                <p:outputLabel for="iptActiveEdit" value="Status"/>
                                <p:selectOneMenu id="iptActiveEdit"
                                                 value="#{serviceController.selected.active}"
                                                 styleClass="w-full">
                                    <f:selectItem itemLabel="Ativo" itemValue="#{true}"/>
                                    <f:selectItem itemLabel="Inativo" itemValue="#{false}"/>
                                </p:selectOneMenu>
                            </div>

                            <div class="field col-12">
                                <p:outputLabel for="iptDescriptionEdit" value="Descrição"/>
                                <p:inputTextarea id="iptDescriptionEdit"
                                                 value="#{serviceController.selected.description}"
                                                 rows="3"
                                                 styleClass="w-full"
                                                 maxlength="1000"
                                                 autoResize="false"/>
                            </div>
                        </div>
                    </ui:fragment>

                    <div class="flex justify-content-end gap-2 mt-4">
                        <p:commandButton value="Cancelar"
                                         type="button"
                                         styleClass="ui-button-secondary"
                                         icon="pi pi-times"
                                         onclick="PF('dlgEdit').hide()"/>
                        <p:commandButton value="Salvar"
                                         icon="pi pi-check"
                                         process="@form"
                                         actionListener="#{serviceController.edit()}"
                                         update=":frmList:growl :frmList:servicesTable @form"
                                         oncomplete="if (args.saved) PF('dlgEdit').hide()"/>
                    </div>
                </h:form>
            </p:dialog>
        </ui:define>
    </ui:composition>
</html>
